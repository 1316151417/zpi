server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 101.200.240.206;

    root /var/www/zpi/site;
    index index.html;
    charset utf-8;
    server_tokens off;
    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
